# Alembic configuration for BrandSentry.
# The database URL is injected programmatically at runtime (see
# app/db/migrations.py) from APP settings; never put secrets in this file.

[alembic]
script_location = migrations
path_separator = os
# The `app` package path is also inserted explicitly in migrations/env.py.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
